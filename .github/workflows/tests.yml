name: CPU science checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_research_docs.py
      - run: python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[clip,llm,test]'
      - run: python -m pytest -q
      - run: synless run --config configs/smoke.json --output runs/smoke
      - run: synless-llm preflight --config configs/llm_smoke.json --output runs/llm_smoke
      - run: synless-llm run --config configs/llm_smoke.json --output runs/llm_smoke
      - run: synless-llm report --config configs/llm_smoke.json --output runs/llm_smoke
